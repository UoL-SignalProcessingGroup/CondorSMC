[tool.poetry]
name = "condorsmc"
version = "1.0.0"
description = "An opportunistic Sequential Monte Carlo Sampler on HTCondor."
authors = [
    "Matthew Carter <matthew.carter@liverpool.ac.uk>",
    "Lee Devlin <lee.devlin@liverpool.ac.uk>",
    "Alexander Phillips <a.m.phillips@liverpool.ac.uk>",
    "Simon Maskell <s.maskell@liverpool.ac.uk>",
    "Paul Spirakis <p.spirakis@liverpool.ac.uk>",
    "Edward Pyzer-Knapp",
]
readme = "README.md"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
appdirs = "^1.4"
numpy = ">=1.22"
scipy = ">=1.8"
autograd = "==1.5"
pymysql = "^1.0"
pyyaml = "^6.0"
tqdm = "^4.0"

[tool.poetry.scripts]
condorsmc = "condorsmc.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120

[mypy]
line_length = 120
